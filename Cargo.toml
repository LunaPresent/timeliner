[package]
name = "timeliner"
version = "0.1.0"
edition = "2024"
description = "Create a topological timeline from a list of dated and ordered events"

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
serde_with = "3"
smallvec = { version = "1", features = ["union"] }
